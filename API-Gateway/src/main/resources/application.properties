spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
management.endpoints.web.exposure.include=*

# Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=zone-service
spring.cloud.gateway.routes[0].uri=lb://zone-management-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/zones/**

spring.cloud.gateway.routes[1].id=sensor-service
spring.cloud.gateway.routes[1].uri=lb://sensor-telemetry-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/sensors/**

spring.cloud.gateway.routes[2].id=automation-service
spring.cloud.gateway.routes[2].uri=lb://automation-control-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/automation/**

spring.cloud.gateway.routes[3].id=crop-service
spring.cloud.gateway.routes[3].uri=lb://crop-inventory-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/crops/**

# JWT Configuration
jwt.secret=AGMSSecretKeyForJWTValidationInGateway2026
jwt.expiration=3600000

# Config Server
spring.config.import=optional:configserver:http://localhost:8888
